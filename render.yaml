# Render Blueprint for Credit Card Approval Prediction
# Deploys the Flask backend API.
# Deploy the Next.js frontend separately on Vercel using vercel.json.

previewsEnabled: false

services:
  - name: credit-approval-api
    plan: free
    region: oregon
    type: web_service
    runtime: python
    rootDir: server/web
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
